services:
  backend:
    image: uozi/nginx-ui:latest
    container_name: nginx-ui-backend
    restart: always
    environment:
      - TZ=Asia/Bangkok
      - NGINX_UI_IGNORE_DOCKER_SOCKET=true
    volumes:
      - nginx-data:/etc/nginx
      - nginx-ui-data:/etc/nginx-ui

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: nginx-ui-frontend
    restart: always
    volumes:
      - ./app/src:/app/src
      - ./app/public:/app/public
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: nginx-ui-proxy
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  nginx-data:
  nginx-ui-data:
